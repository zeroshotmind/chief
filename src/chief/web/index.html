<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chief</title>
<link rel="stylesheet" href="./chief.css">
<!-- Installable on a phone, reached over the tailnet. `theme_color` in the manifest is one
     colour and the UI is two, so the status bar is matched here instead, per scheme. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chief">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<!-- The mark, inline: Chief is self-hosted (REQ-21) and the tab icon must not be one
     more thing the page reaches out for. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='10' fill='%23c4622d'/><circle cx='24' cy='14' r='5' fill='%23fdfcfa'/><path d='M24 19 v10 M24 29 l-10 8 M24 29 l10 8' stroke='%23fdfcfa' stroke-width='3.5' stroke-linecap='round' fill='none'/><circle cx='14' cy='39' r='4' fill='%23fdfcfa'/><circle cx='34' cy='39' r='4' fill='%23fdfcfa' opacity='0.55'/></svg>">
</head>
<body>
<div id="app"></div>
<div id="viewer-root"></div>
<div id="dialog-root"></div>
<noscript>The Chief web UI needs JavaScript. The same data is available from the REST API at /v1.</noscript>
<script type="module" src="./app.js"></script>
<!-- Registered after the app, and failure is ignored on purpose: the worker only makes Chief
     installable and survivable offline, so a browser that refuses it should still get the UI.
     Nothing here caches /v1 — see sw.js. -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
